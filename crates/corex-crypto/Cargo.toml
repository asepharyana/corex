[package]
name = "corex-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asepharyana/mytheclipse"
homepage = "https://github.com/asepharyana/mytheclipse"
documentation = "https://docs.rs/corex-crypto"
authors = ["asepharyana <superaseph@gmail.com>"]
description = "Safe hashing, encryption, and token helpers (Argon2id, AES-256-GCM, JWT/Paseto) with key rotation support."
readme = "README.md"
keywords = ["crypto", "argon2", "aes-gcm", "jwt", "security"]
categories = ["cryptography", "authentication"]

[features]
default = ["password", "encryption", "tokens"]
# Low-level primitives are always available (zero-cost). The feature flags
# pull in the backing SDK crates.
password = ["dep:password-hash", "dep:argon2"]
encryption = ["dep:aead", "dep:aes-gcm", "dep:rand_core", "dep:rand"]
tokens = ["encryption", "dep:serde", "dep:serde_json", "dep:base64", "dep:jsonwebtoken"]

[dependencies]
tracing = "0.1"

# Optional backends
argon2 = { version = "0.5", default-features = false, features = ["std"], optional = true }
password-hash = { version = "0.5", default-features = false, features = ["std"], optional = true }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"], optional = true }
aead = { version = "0.5", default-features = false, features = ["alloc"], optional = true }
jsonwebtoken = { version = "9", default-features = false, optional = true }
base64 = { version = "0.22", default-features = false, optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"], optional = true }
rand_core = { version = "0.6", optional = true }
