[package]
name = "mytheclipse-storage"
version = "1.3.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asepharyana/mytheclipse"
homepage = "https://github.com/asepharyana/mytheclipse"
documentation = "https://docs.rs/mytheclipse-storage"
authors = ["asepharyana <superaseph@gmail.com>"]
description = "Unified storage & file system abstraction: one driver interface over Local Disk, S3/MinIO, and Google Cloud Storage, with stream-based upload/download."
readme = "README.md"
keywords = ["storage", "s3", "gcs", "minio", "filesystem"]
categories = ["filesystem", "asynchronous"]

[features]
default = ["local"]
# The core `StorageDriver` trait (always compiled) needs `tokio`'s io-util for
# `AsyncRead`/`ReadBuf`; `local` additionally needs `fs`/`rt`.
local = ["tokio/fs", "tokio/rt"]
# S3-compatible object storage (also covers MinIO via a custom endpoint).
s3 = ["dep:aws-sdk-s3", "dep:aws-config", "dep:aws-credential-types"]
# Google Cloud Storage.
gcs = ["dep:google-cloud-storage", "dep:google-cloud-auth"]

[dependencies]
tracing = "0.1"
# Required unconditionally: the core `StorageDriver` trait uses both.
async-trait = "0.1"
tokio = { version = "1.53", features = ["io-util"] }
bytes = "1"

# S3 / MinIO
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true, features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", optional = true }

# Google Cloud Storage
google-cloud-storage = { version = "0.24", optional = true }
google-cloud-auth = { version = "0.17", optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
tempfile = "3"
