[package]
name = "mytheclipse-cli"
version = "1.9.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asepharyana/mytheclipse"
homepage = "https://github.com/asepharyana/mytheclipse"
documentation = "https://docs.rs/mytheclipse-cli"
authors = ["asepharyana <superaseph@gmail.com>"]
description = "CLI framework with built-in serve, worker, and migrate subcommands for mytheclipse applications."
readme = "README.md"
keywords = ["cli", "clap", "command-line", "framework"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["clap-derive"]
# Use clap derive macros.
clap-derive = ["dep:clap"]

[dependencies]
tracing = "0.1"
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
